# ckcSOC Docker Compose — Hybrid Mode
# Infrastructure (Kafka, ES) in Docker + Pipeline runs as one-shot job
# Ollama must run natively for M4 GPU: ollama serve

x-soc-base: &soc-base
  build: .
  restart: 'no'
  environment:
    - KAFKA_BOOTSTRAP=kafka:9092
    - HF_HOME=/app/models/hf_ner
    - OLLAMA_URL=http://host.docker.internal:11434
    - ES_URL=http://elasticsearch:9200
  volumes:
    - ./models:/app/models
    - ./state:/app/state
    - ./datasets:/app/datasets
  depends_on:
    kafka:
      condition: service_healthy
    elasticsearch:
      condition: service_healthy

services:

  # ── Infrastructure ──────────────────────────────
  kafka:
    image: apache/kafka:3.9.2
    ports: ['9092:9092']
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ['CMD-SHELL', '/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1']
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports: ['9200:9200']
    volumes: [es_data:/usr/share/elasticsearch/data]
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:9200/_cluster/health']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Pipeline Runner (one-shot batch) ────────────
  # Runs the full 11-layer LangGraph pipeline then exits.
  # Ollama must be running natively: ollama serve
  pipeline:
    <<: *soc-base
    command: python run_demo.py --no-plots
    profiles: ['run']

  # ── API Gateway ─────────────────────────────────
  # Serves dashboard data from state/ files to the React frontend.
  gateway:
    <<: *soc-base
    command: uvicorn api.gateway_api:app --host 0.0.0.0 --port 8000
    ports: ['8000:8000']
    restart: unless-stopped

  # ── Drift Monitor ──────────────────────────────
  drift-monitor:
    <<: *soc-base
    command: python -m pipeline.drift_monitor
    restart: unless-stopped

volumes:
  es_data:
